<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMS SCHEDULES</title>
    <link rel="stylesheet" href="schedule.css">
</head>
<body>

    <header>
        <h1>Exams Operation Tables</h1>
        <p>Organize the two weeks of exams on two tables</p>
    </header>

    <main>
        <section>
            <h2>daily schedule</h2>
            <table>
                <caption>Week 1 Exams Schedule</caption>
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Time</th>
                        <th scope="col">Exam</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Monday</th>
                        <td>
                            <time datetime="12:30">12:30PM</time>-<time datetime="13:30">13:30PM</time>
                        </td>
                        <td>Python</td>
                    </tr>
                    <tr>
                        <th scope="row">Tuesday</th>
                        <td>
                            <time datetime="08:30">08:30AM</time>-<time datetime="09:30">09:30AM</time>
                        </td>
                        <td>HTML-CSS</td>
                    </tr>
                    <tr>
                        <th scope="row">Wednesday</th>
                        <td>
                            <time datetime="08:30">08:30AM</time>-<time datetime="09:30">09:30AM</time>
                        </td>
                        <td>Network</td>
                    </tr>
                    <tr>
                        <th scope="row">Friday</th>
                        <td>
                            <time datetime="08:30">08:30AM</time>-<time datetime="09:30">09:30AM</time>
                        </td>
                        <td>Finance</td>
                    </tr>
                        
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Only for the exams period</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>
    
</body>
</html>
