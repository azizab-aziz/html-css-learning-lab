<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
</head>
<body>

  <h1>Product Gallery</h1>
  <p>A quick look at current warehouse stock, with images for each item.</p>

  <figure>
    <img
      src="images/laptop.jpg"
      alt="Black laptop displayed on a warehouse shelf"
      width="400"
      height="300"
    />
    <figcaption>Available laptop inventory.</figcaption>
  </figure>

  <figure>
    <img
      src="images/monitor.jpg"
      alt="Widescreen monitor standing on a warehouse shelf"
      width="400"
      height="300"
    />
    <figcaption>Available monitor inventory.</figcaption>
  </figure>

  <figure>
    <img
      src="images/keyboard.jpg"
      alt="Wired keyboard packaged and ready for shipment"
      width="400"
      height="300"
    />
    <figcaption>Available keyboard inventory.</figcaption>
  </figure>

</body>
</html>
