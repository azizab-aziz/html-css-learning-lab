<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
</head>
<body>

  <h1>Product Gallery</h1>
  <p>A quick look at items currently available in warehouse inventory.</p>

  <figure>
    <img
      src="images/laptop.jpg"
      alt="Black laptop displayed on a warehouse shelf"
      width="400"
      height="300"
    />
    <figcaption>Available laptop inventory.</figcaption>
  </figure>

  <figure>
    <img
      src="images/monitor.jpg"
      alt="Widescreen monitor positioned on a storage shelf"
      width="400"
      height="300"
    />
    <figcaption>Monitors currently in stock.</figcaption>
  </figure>

  <figure>
    <img
      src="images/keyboard.jpg"
      alt="Wired keyboard packaged for warehouse storage"
      width="400"
      height="300"
    />
    <figcaption>Keyboards ready for shipment.</figcaption>
  </figure>

</body>
</html>
