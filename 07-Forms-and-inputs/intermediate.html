<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact the warehouse team</title>
</head>
<body>

    <header>
        <h1>Contact the warehouse Team</h1>
        <p>Questions about stock, deliveries, or the system send us a message and we will reply within one working day.</p>
    </header>

    <main>


        <h2 id="Contact-form-title">Send us a message</h2>
        <p>Fields marked "required must be filled in before sending.</p>

        <form action="#" method="get" aria-labelledby="Contact-form-title">
            <div>
                <label for="name">Full name (required)</label>
                <input id="name" name="name" type="text" autocomplete="name" required/>
            </div>

            <div>
                <label for="email">Email address (required)</label>
                <input id="email" name="email" type="email" autocomplete="email" required />
            </div>

            <di>
                <label for="phone">Phone number (optional)</label>
                <input id="Phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint" />
                <small id="phone-hint">Include the country code, for example +216 12 345 678.</small>
            </di>

            <div>
                <label for="message">Message (required)</label>
                <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
            </div>

            <button type="submit">Send message</button>


        </form>

    </main>

    <footer>
        <p><small>Created for HTML practice.</small></p>
    </footer>
    
</body>
</html>
